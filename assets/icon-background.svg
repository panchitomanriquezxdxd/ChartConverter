<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Chart Converter</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14203a"/><stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/><stop offset=".55" stop-color="#ff007f"/><stop offset="1" stop-color="#ffea00"/>
    </linearGradient>
    <linearGradient id="gA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#00ff66"/>
    </linearGradient>
    <linearGradient id="gB" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ff007f"/><stop offset="1" stop-color="#ffea00"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
</svg>
