name: Build apps

# Compila Windows, Linux, Android e iOS.
#  • Manual:  pestaña Actions → "Build apps" → Run workflow
#  • Release: sube un tag  (git tag v3.1.0 && git push origin v3.1.0)  y se publican los archivos en Releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # ---------------------------------------------------------------- Windows y Linux (Electron)
  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            script: dist:win
            files: |
              dist/*.exe
          - name: linux
            os: ubuntu-latest
            script: dist:linux
            files: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar (${{ matrix.name }})
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: chartconverter-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # ---------------------------------------------------------------- Android (Capacitor → APK)
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Preparar web (www/)
        run: npm run build:web
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Generar iconos y splash desde assets/
        run: npx capacitor-assets generate --android
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Renombrar APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "ChartConverter-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: chartconverter-android
          path: ChartConverter-*-android.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- iOS (Capacitor → .ipa sin firmar)
  ios:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Preparar web (www/)
        run: npm run build:web
      - name: Crear proyecto iOS
        run: npx cap add ios
      - name: Generar iconos y splash desde assets/
        run: npx capacitor-assets generate --ios
      - name: Sincronizar
        run: npx cap sync ios
      - name: Compilar (sin firmar)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Empaquetar .ipa
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "ChartConverter-${VERSION}-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: chartconverter-ios
          path: ChartConverter-*-ios-unsigned.ipa
          if-no-files-found: error

  # ---------------------------------------------------------------- Publicar en Releases (solo con tag v*)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
